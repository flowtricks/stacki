name: Release button

# The release button: Actions > Release button > Run workflow. Every decision is made by
# scripts/release/releaseGo.mts; this file only orders its stages and passes
# inputs through environment variables (never interpolated into a shell line).
# docs/release-runbook.md describes the flow, the one-time setup and failures.
#
# After the tag lands, the chain continues from events: release.yml builds and
# publishes the desktop release, then release-post.yml publishes create-stacki,
# waits for npm, deploys stacki.build and verifies everything.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (plan only; nothing is committed, tagged or pushed)
        type: boolean
        default: true
      version:
        description: Version (leave empty for the next patch after the last tag)
        type: string
        required: false
        default: ''
      notes:
        description: Release notes body (leave empty to generate from the commits)
        type: string
        required: false
        default: ''
      allow_minor:
        description: Allow a minor or major version (only when the maintainer asked for one)
        type: boolean
        default: false

# Two releases can never overlap; a second click waits for the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # The exact tip of main is green, the version follows the rules, its tag is
  # absent, and for a real run the approval environment and the push token
  # exist. Records the SHA every later job works from.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.preflight.outputs.sha }}
      version: ${{ steps.preflight.outputs.version }}
      mode: ${{ steps.preflight.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - id: preflight
        run: node --experimental-strip-types scripts/release/releaseGo.mts --stage=preflight --dry-run="$DRY_RUN" --version="$VERSION" --allow-minor="$ALLOW_MINOR" --notes="$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
          ALLOW_MINOR: ${{ inputs.allow_minor }}
          NOTES: ${{ inputs.notes }}
          RELEASE_PUSH_TOKEN_PRESENT: ${{ secrets.RELEASE_PUSH_TOKEN != '' }}

  # The human click. The `release` environment's required reviewers hold this
  # job until one approves; the script re-checks the environment really has
  # them, because GitHub would create an unprotected one on first reference.
  # A dry run skips it: it changes nothing, so it needs no approval.
  approve:
    needs: preflight
    if: needs.preflight.outputs.mode == 'release'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node --experimental-strip-types scripts/release/releaseGo.mts --stage=approve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUSH_TOKEN_PRESENT: ${{ secrets.RELEASE_PUSH_TOKEN != '' }}

  # Compare and swap on main, the bump commit, the tag, and one atomic push with
  # a token whose pushes start release.yml (GITHUB_TOKEN's do not). In a dry run
  # it prints the plan and stops before any commit, tag or push.
  prepare-and-tag:
    needs: [preflight, approve]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && (needs.approve.result == 'success' || needs.preflight.outputs.mode == 'dry-run') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_PUSH_TOKEN || github.token }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node --experimental-strip-types scripts/release/releaseGo.mts --stage=tag --dry-run="$DRY_RUN" --expected-sha="$EXPECTED_SHA" --version="$VERSION" --allow-minor="$ALLOW_MINOR" --notes="$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ needs.preflight.outputs.mode == 'dry-run' }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
          ALLOW_MINOR: ${{ inputs.allow_minor }}
          NOTES: ${{ inputs.notes }}
          RELEASE_PUSH_TOKEN_PRESENT: ${{ secrets.RELEASE_PUSH_TOKEN != '' }}
          GIT_AUTHOR_NAME: Stacki release
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: Stacki release
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
