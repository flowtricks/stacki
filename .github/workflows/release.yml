name: Release

# Promotion only. A vX.Y.Z tag is created (by `npm run release:ship`) only when
# check.yml and candidate.yml are both green on its exact commit; this
# workflow then publishes the files candidate.yml already built, signed,
# notarized and tested for that commit. Nothing is rebuilt or retested here,
# so the only things that can fail are a download or an upload, and both are
# safe to re-run on the same tag: a version is never burned for infrastructure.
#
# A manual run is always a dry run: it proves the candidate of the given tag's
# commit (a rehearsal candidate is accepted), downloads and checks its files,
# and stops before anything is uploaded. Release post follows tag pushes only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: The vX.Y.Z whose commit's candidate to rehearse (dry run; nothing is uploaded)
        type: string
        required: true
      sha:
        description: The commit to rehearse; empty means the tag's commit
        type: string
        required: false
        default: ''

# One promotion per tag; a re-run waits for the one before it.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts
            docs
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - id: target
        name: Name the tag, the commit and the mode
        run: |
          if [ "$EVENT" = push ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "sha=${INPUT_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SHA: ${{ inputs.sha }}
      # Refuses unless Check and the candidate are green on this exact commit.
      - id: prove
        run: node --experimental-strip-types scripts/release/promote.mts --sha="$SHA" --tag="$TAG" --dry-run="$DRY_RUN"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          TAG: ${{ steps.target.outputs.tag }}
          DRY_RUN: ${{ steps.target.outputs.dry_run }}
      - uses: actions/download-artifact@v7
        with:
          pattern: candidate-*
          path: candidate
          merge-multiple: true
          run-id: ${{ steps.prove.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: optional-demo
          path: optional-demo
          run-id: ${{ steps.prove.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      # The same check the candidate passed, on the files as downloaded.
      - run: node --experimental-strip-types scripts/release/candidate.mts --stage=assets --version="${TAG#v}" --directory=candidate
        env:
          TAG: ${{ steps.target.outputs.tag }}
      # Idempotent: an existing draft is reused and every file is replaced, so a
      # re-run after a failed upload completes the same release.
      - name: Upload into the draft
        if: steps.target.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo flowtricks/stacki-releases >/dev/null 2>&1; then
            gh release create "$TAG" --repo flowtricks/stacki-releases --draft --title "${TAG#v}" --notes ""
          fi
          gh release upload "$TAG" candidate/* --repo flowtricks/stacki-releases --clobber
          if [ -d optional-demo ] && [ -n "$(ls -A optional-demo)" ]; then
            gh release upload "$TAG" optional-demo/* --repo flowtricks/stacki-releases --clobber || echo "::warning::the optional demo did not upload; the site keeps its last copy"
          fi
      - name: Publish once every required file is on the draft
        if: steps.target.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          gh release download "$TAG" --repo flowtricks/stacki-releases --pattern 'latest*.yml' --dir uploaded --clobber
          for name in $(ls candidate); do
            gh release view "$TAG" --repo flowtricks/stacki-releases --json assets --jq '.assets[].name' | grep -qxF "$name" || { echo "missing $name on the draft; refusing to publish"; exit 1; }
          done
          for feed in uploaded/*.yml; do
            cmp -s "$feed" "candidate/$(basename "$feed")" || { echo "$(basename "$feed") on the draft differs from the candidate's; refusing to publish"; exit 1; }
          done
          gh release edit "$TAG" --repo flowtricks/stacki-releases --draft=false --latest

      # No site deploy here: stacki.build bakes the create-stacki package, which npm
      # does not have yet at this point (1.4.7 and 1.4.8 were built from the old one).
      # Release post deploys it after wait-npm and verifies it over HTTP.
